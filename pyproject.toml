[project]
name = "sdr-cli"
version = "0.1.0"
description = "POC bulk power-user CLI for Stanford Digital Repository (Argo). Dry-run only: explains what each call would do."
readme = "README.md"
authors = [
    { name = "davidschober", email = "davidschob@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.1",
    "rich>=15.0.0",
]

[project.scripts]
sdr = "sdr_cli.cli:cli"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
